name: Update StanFinder

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "stanfinder"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Belgrade GTFS
        uses: actions/cache@v4
        with:
          path: routing_data
          key: belgrade-gtfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            belgrade-gtfs-${{ runner.os }}-

      - name: Scan listings, galleries and public transport
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      - name: Commit updated apartment data
        run: |
          git config user.name "stanfinder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json site/data/listings.json
          git diff --cached --quiet || git commit -m "Update apartment data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
