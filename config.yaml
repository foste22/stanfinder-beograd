app:
  max_price_eur: 400
  max_average_minutes: 60
  max_single_trip_minutes: 75
  min_samples_per_destination: 4
  timezone: Europe/Belgrade

routing:
  sample_times:
    - "07:30"
    - "09:00"
    - "14:00"
    - "17:00"
  walking_speed_mps: 1.33
  walking_distance_factor: 1.20
  max_access_walk_m: 1200
  max_egress_walk_m: 1200
  max_transfer_walk_m: 350
  max_transit_rides: 4
  gtfs_url: "https://data.gov.rs/sr/datasets/r/729be9a1-7ed9-453d-9a3d-68fa30f07529"
  gtfs_path: "routing_data/beograd_gtfs.zip"
  gtfs_max_age_hours: 24

destinations:
  - name: "Fakultet 1"
    lat: 44.855010356940085
    lon: 20.38110204129845
  - name: "Fakultet 2"
    lat: 44.81881998489189
    lon: 20.456654438685682

sources:
  four_zida:
    enabled: true
    search_url: "https://www.4zida.rs/izdavanje-stanova/beograd/do-400-evra?sortiranje=najnoviji"
    max_new_details_per_run: 12
    request_delay_seconds: 1.2

  nekretnine_rs:
    enabled: true
    search_url: "https://www.nekretnine.rs/izdavanje-stanova/beograd/?criterio=rilevanza&prezzoMassimo=416&prezzoMinimo=224"
    max_new_details_per_run: 16
    request_delay_seconds: 1.3

  halo_oglasi:
    enabled: true
    # Javni Halo prikaz koji ne vraća 403 kao desktop www verzija.
    search_url: "https://smsprint.halooglasi.com/nekretnine/izdavanje-stanova/beograd"
    max_new_details_per_run: 60
    request_delay_seconds: 1.5
    pages_per_category: 4

  oglasi_rs:
    enabled: true
    search_url: "https://www.oglasi.rs/nekretnine/izdavanje-stanova/beograd"
    max_new_details_per_run: 10
    request_delay_seconds: 1.3

geocoding:
  # Public Nominatim policy for recurring scripts: <=4 requests/minute.
  # 24 nove adrese po run-u, ali i dalje samo jedan zahtev na 16 sekundi.
  # To je ~3.75 zahteva/min, a svi rezultati se keširaju.
  max_new_requests_per_run: 24
  min_interval_seconds: 16

notifications:
  telegram:
    enabled: false
